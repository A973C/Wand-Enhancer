name: Auto sync

on:
  schedule:
    - cron: '0 4 * * *'   # tous les jours à 04h00 UTC
  workflow_dispatch:       # permet aussi de le lancer à la main

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Jeton personnel : le jeton automatique de GitHub n'a pas le droit
      # de mettre a jour les fichiers .github/workflows/ venant de l'auteur.
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Vérifier la présence du jeton
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Le secret SYNC_TOKEN est absent. Cree un jeton personnel (droits Contents, Workflows, Actions en ecriture) et enregistre-le dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Synchroniser avec le repo original
        id: sync
        run: |
          before=$(gh api "repos/$GH_REPO/commits/$BRANCH" --jq .sha)

          if ! gh api --method POST "repos/$GH_REPO/merge-upstream" -f branch="$BRANCH"; then
            echo "::error::Fusion impossible. Causes possibles : jeton expire ou droits insuffisants, ou un fichier du repo original a ete modifie dans le fork."
            exit 1
          fi

          after=$(gh api "repos/$GH_REPO/commits/$BRANCH" --jq .sha)

          if [ "$before" != "$after" ]; then
            echo "Nouveaux commits : $before -> $after"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aucune mise a jour."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lancer le build si mise à jour
        if: steps.sync.outputs.changed == 'true'
        run: gh workflow run build-release.yml --ref "$BRANCH"
